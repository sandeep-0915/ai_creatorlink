<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CreatorLink{% endblock %}</title>
<style>
  :root {
    --ink: #1d1b3a; --muted: #6a6784; --bg: #faf7f2; --card: #ffffff;
    --accent: #e8590c; --accent-soft: #fff0e6; --ok: #2b8a3e; --ok-soft: #e9f7ec;
    --line: #e7e2d8; --indigo: #3b3a8f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5;
    font-family: "Noto Sans", "Noto Sans Devanagari", "Noto Sans Tamil", "Noto Sans Telugu",
                 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 18px 60px; }
  header.top { display: flex; justify-content: space-between; align-items: center;
    padding: 16px 0; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .logo { font-weight: 800; font-size: 20px; color: var(--ink); text-decoration: none; }
  .logo span { color: var(--accent); }
  nav a { color: var(--muted); text-decoration: none; margin-left: 18px; font-size: 14px; }
  nav a:hover { color: var(--ink); }
  h1 { font-size: 32px; line-height: 1.2; margin: 28px 0 8px; }
  h2 { font-size: 20px; margin: 28px 0 10px; }
  .lead { color: var(--muted); font-size: 17px; margin: 0 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin: 14px 0; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input, select, textarea { width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
    border: 1px solid var(--line); border-radius: 9px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .row, .row3 { grid-template-columns: 1fr; } h1 { font-size: 26px; } }
  .btn { display: inline-block; background: var(--accent); color: #fff; border: 0; cursor: pointer;
    padding: 12px 20px; border-radius: 10px; font: inherit; font-weight: 700; text-decoration: none; }
  .btn:hover { filter: brightness(.95); }
  .btn.ghost { background: transparent; color: var(--indigo); border: 1px solid var(--indigo); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .chip { background: var(--accent-soft); color: var(--accent); border: 1px solid #ffd8bf;
    padding: 6px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; font: inherit;
    font-size: 13px; font-weight: 600; }
  .tag { display: inline-block; background: #efeefb; color: var(--indigo); padding: 3px 10px;
    border-radius: 99px; font-size: 12px; font-weight: 600; margin: 2px 4px 2px 0; }
  .badge { display: inline-block; background: var(--ok-soft); color: var(--ok); border: 1px solid #c4e8cb;
    padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
  .score { font-size: 30px; font-weight: 800; color: var(--accent); line-height: 1; }
  .bar { height: 7px; background: var(--line); border-radius: 9px; overflow: hidden; margin-top: 6px; width: 120px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
  .rank { color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .04em; }
  .name { font-size: 20px; font-weight: 800; margin: 2px 0; }
  .muted { color: var(--muted); font-size: 14px; }
  .concept { background: #f6f5ff; border-left: 4px solid var(--indigo); border-radius: 8px;
    padding: 12px 16px; margin: 14px 0; }
  .concept .hook { font-size: 19px; font-weight: 700; margin: 4px 0 8px; }
  .concept ul { margin: 6px 0 0; padding-left: 20px; }
  .why { margin: 8px 0; padding-left: 20px; }
  pre.agreement { white-space: pre-wrap; background: #fff; border: 1px dashed var(--muted);
    border-radius: 10px; padding: 18px; font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; }
  .note { background: var(--accent-soft); border: 1px solid #ffd8bf; border-radius: 10px;
    padding: 10px 14px; font-size: 14px; margin: 14px 0; }
  .ok { background: var(--ok-soft); border-color: #c4e8cb; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .checks label { display: inline-block; font-weight: 500; margin: 4px 12px 4px 0; }
  .checks input { width: auto; margin-right: 5px; }
  @media print { header.top, .noprint { display: none; } body { background: #fff; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="{{ url_for('index') }}">Creator<span>Link</span></a>
    <nav><a href="{{ url_for('index') }}">Post a brief</a><a href="{{ url_for('creators') }}">Creators</a></nav>
  </header>
  {% block body %}{% endblock %}
</div>
</body>
</html>
